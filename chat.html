<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101713">
  <title>FreeForm In-Game Chat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --chat-bg: rgba(16, 23, 19, .94);
      --chat-panel: #18221c;
      --chat-border: rgba(255,255,255,.12);
      --chat-text: #f2f7f3;
      --chat-muted: #a6b2a9;
      --chat-green: #39d278;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: var(--chat-text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .chat-widget {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--chat-border);
      border-radius: 12px;
      background: var(--chat-bg);
      box-shadow: 0 10px 35px rgba(0,0,0,.3);
      backdrop-filter: blur(10px);
    }

    .chat-header {
      min-height: 43px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 12px;
      border-bottom: 1px solid var(--chat-border);
      background: rgba(255,255,255,.025);
    }

    .chat-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .chat-heading i { color: var(--chat-green); }

    .chat-state {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--chat-muted);
      font-size: 10px;
    }

    .chat-state-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--chat-green);
    }

    .chat-messages {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 9px;
      overflow-y: auto;
      padding: 11px;
      scrollbar-color: #44574a transparent;
      scrollbar-width: thin;
    }

    .chat-empty {
      margin: auto;
      color: var(--chat-muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .chat-empty i {
      display: block;
      margin-bottom: 8px;
      color: #748279;
      font-size: 22px;
    }

    .chat-message {
      max-width: 95%;
      align-self: flex-start;
      animation: message-in .15s ease-out;
    }

    .chat-message.own { align-self: flex-end; }

    .message-meta {
      display: flex;
      gap: 6px;
      margin: 0 4px 4px;
      color: var(--chat-muted);
      font-size: 10px;
    }

    .chat-message.own .message-meta { justify-content: flex-end; }

    .message-name {
      color: #c8f2d6;
      font-weight: 700;
    }

    .message-bubble {
      padding: 8px 10px;
      border: 1px solid var(--chat-border);
      border-radius: 10px 10px 10px 3px;
      background: var(--chat-panel);
      color: var(--chat-text);
      font-size: 12px;
      line-height: 1.4;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .chat-message.own .message-bubble {
      border-color: rgba(57,210,120,.25);
      border-radius: 10px 10px 3px 10px;
      background: rgba(27,155,82,.25);
    }

    .chat-compose {
      display: flex;
      align-items: end;
      gap: 7px;
      padding: 9px;
      border-top: 1px solid var(--chat-border);
    }

    .chat-input {
      width: 100%;
      min-height: 36px;
      max-height: 88px;
      resize: none;
      padding: 9px 10px;
      border: 1px solid var(--chat-border);
      border-radius: 8px;
      outline: none;
      background: rgba(0,0,0,.2);
      color: var(--chat-text);
      font: inherit;
      font-size: 12px;
      line-height: 1.4;
    }

    .chat-input::placeholder { color: #87948b; }

    .chat-input:focus { border-color: rgba(57,210,120,.65); }

    .chat-send {
      width: 37px;
      height: 36px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: var(--chat-green);
      color: #102016;
      cursor: pointer;
    }

    .chat-send:hover { background: #63e596; }

    .chat-send:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .chat-bubble {
      position: fixed;
      z-index: 9999;
      max-width: 240px;
      padding: 9px 12px;
      transform: translate(-50%, -100%);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 12px 12px 12px 3px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 5px 18px rgba(0,0,0,.22);
      color: #18221c;
      font-size: 13px;
      line-height: 1.35;
      overflow-wrap: anywhere;
      pointer-events: none;
      animation: bubble-in .18s ease-out;
    }

    .chat-bubble[hidden] { display: none; }

    .chat-bubble::after {
      content: "";
      position: absolute;
      bottom: -7px;
      left: 13px;
      width: 12px;
      height: 12px;
      transform: rotate(45deg);
      border-right: 1px solid rgba(255,255,255,.25);
      border-bottom: 1px solid rgba(255,255,255,.25);
      background: rgba(255,255,255,.96);
    }

    .chat-bubble-name {
      display: block;
      margin-bottom: 3px;
      color: #168746;
      font-size: 10px;
      font-weight: 800;
    }

    .chat-error {
      min-height: 14px;
      padding: 0 10px 6px;
      color: #ffaaa2;
      font-size: 10px;
    }

    @keyframes message-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bubble-in {
      from { opacity: 0; transform: translate(-50%, -90%) scale(.94); }
      to { opacity: 1; transform: translate(-50%, -100%) scale(1); }
    }

    @media (max-width: 520px) {
      .chat-header { min-height: 38px; }
      .chat-messages { padding: 8px; }
      .chat-compose { padding: 7px; }
    }
  </style>
</head>
<body>
  <section class="chat-widget" aria-label="In-game chat">
    <header class="chat-header">
      <div class="chat-heading">
        <i class="fa-solid fa-comments" aria-hidden="true"></i>
        <span>Game chat</span>
      </div>
      <div class="chat-state" id="chatState" aria-live="polite">
        <span class="chat-state-dot"></span>
        <span>Local chat</span>
      </div>
    </header>
<div class="chat-messages" id="chatMessages" role="log" aria-live="polite">
  <div class="chat-empty" id="chatEmpty">
    <i class="fa-regular fa-message" aria-hidden="true"></i>
    Messages you send will appear here.
  </div>
</div>

<div class="chat-error" id="chatError" aria-live="polite"></div>

<form class="chat-compose" id="chatForm">
  <textarea
    class="chat-input"
    id="chatInput"
    maxlength="180"
    rows="1"
    placeholder="Type a message..."
    aria-label="Type a chat message"></textarea>
  <button class="chat-send" id="chatSend" type="submit" aria-label="Send message">
    <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
  </button>
</form>

  </section>
  <div class="chat-bubble" id="chatBubble" hidden>
    <span class="chat-bubble-name" id="bubbleName"></span>
    <span id="bubbleText"></span>
  </div>
  <script src="assets/freeform.js"></script>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const game = params.get('game') || 'game';
    const playerName = window.FreeForm?.getSession?.() || 'Guest';

    const chatMessages = document.getElementById('chatMessages');
    const chatEmpty = document.getElementById('chatEmpty');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const chatError = document.getElementById('chatError');
    const chatBubble = document.getElementById('chatBubble');
    const bubbleName = document.getElementById('bubbleName');
    const bubbleText = document.getElementById('bubbleText');

    let bubbleTimeout;
    let unsubscribe = null;
    let database = null;
    let chatRef = null;

    function showBubble(name, message) {
      bubbleName.textContent = name;
      bubbleText.textContent = message;
      chatBubble.hidden = false;

      if (typeof window.FreeFormChat?.getPlayerScreenPosition === 'function') {
        const position = window.FreeFormChat.getPlayerScreenPosition();

        if (position && Number.isFinite(position.x) && Number.isFinite(position.y)) {
          chatBubble.style.left = position.x + 'px';
          chatBubble.style.top = position.y + 'px';
        } else {
          chatBubble.style.left = '50%';
          chatBubble.style.top = '30%';
        }
      } else {
        chatBubble.style.left = '50%';
        chatBubble.style.top = '30%';
      }

      clearTimeout(bubbleTimeout);
      bubbleTimeout = setTimeout(() => {
        chatBubble.hidden = true;
      }, 5000);
    }

    function addMessage(name, text, own = false, time = Date.now()) {
      const message = String(text || '').trim();
      if (!message) return;

      chatEmpty?.remove();

      const item = document.createElement('article');
      item.className = 'chat-message' + (own ? ' own' : '');

      const meta = document.createElement('div');
      meta.className = 'message-meta';

      const sender = document.createElement('span');
      sender.className = 'message-name';
      sender.textContent = name || 'Guest';

      const clock = document.createElement('time');
      const date = new Date(time);
      clock.dateTime = date.toISOString();
      clock.textContent = date.toLocaleTimeString([], {
        hour: 'numeric',
        minute: '2-digit'
      });

      meta.append(sender, clock);

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.textContent = message;

      item.append(meta, bubble);
      chatMessages.appendChild(item);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      if (own) showBubble(name || 'Guest', message);
    }

    function setConnectionLabel(label) {
      document.querySelector('#chatState span:last-child').textContent = label;
    }

    async function startFirebaseChat() {
      try {
        const firebaseModule = await import('./assets/firebase-cloud.js');

        /*
          Optional integration contract:
          Export getChatDatabase() from firebase-cloud.js, returning the
          initialized Firebase Realtime Database instance.

          If the export is unavailable, the chat remains usable locally.
        */
        if (typeof firebaseModule.getChatDatabase !== 'function') {
          setConnectionLabel('Local chat');
          return;
        }

        const { get, getDatabase, limitToLast, onChildAdded, orderByChild, push, query, ref, serverTimestamp, set } =
          await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');

        database = firebaseModule.getChatDatabase() || getDatabase();
        chatRef = ref(database, 'gameChats/' + game);
        const recentMessages = query(chatRef, orderByChild('createdAt'), limitToLast(60));

        unsubscribe = onChildAdded(recentMessages, snapshot => {
          const data = snapshot.val();
          if (!data || !data.text) return;

          addMessage(
            data.name || 'Guest',
            data.text,
            data.name === playerName && data.clientId === clientId,
            data.createdAt || Date.now()
          );
        });

        window.FreeFormChat = window.FreeFormChat || {};
        window.FreeFormChat.send = async text => {
          const newMessage = push(chatRef);
          await set(newMessage, {
            name: playerName,
            text: String(text).slice(0, 180),
            clientId,
            createdAt: serverTimestamp()
          });
        };

        setConnectionLabel('Connected');
      } catch (error) {
        console.info('Firebase chat is not configured; using local chat.', error);
        setConnectionLabel('Local chat');
      }
    }

    const clientId = (crypto.randomUUID?.() || String(Date.now()) + Math.random());

    chatForm.addEventListener('submit', async event => {
      event.preventDefault();
      const text = chatInput.value.trim();

      if (!text) return;

      chatError.textContent = '';

      if (typeof window.FreeFormChat?.send === 'function') {
        try {
          await window.FreeFormChat.send(text);
        } catch (error) {
          chatError.textContent = 'Message could not be sent. Check your connection.';
          return;
        }
      } else {
        addMessage(playerName, text, true);
      }

      chatInput.value = '';
      chatInput.style.height = '36px';
      chatInput.focus();
    });

    chatInput.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        chatForm.requestSubmit();
      }
    });

    chatInput.addEventListener('input', () => {
      chatInput.style.height = '36px';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 88) + 'px';
    });

    /*
      Game integration:
      Call this from a game after updating the player's projected screen point:
      window.FreeFormChat.setPlayerScreenPosition(x, y);

      x/y are viewport pixels marking the top of the character.
    */
    window.FreeFormChat = window.FreeFormChat || {};
    window.FreeFormChat.setPlayerScreenPosition = (x, y) => {
      if (!Number.isFinite(x) || !Number.isFinite(y)) return;
      chatBubble.style.left = x + 'px';
      chatBubble.style.top = y + 'px';
    };

    window.addEventListener('beforeunload', () => {
      if (typeof unsubscribe === 'function') unsubscribe();
    });

    startFirebaseChat();
  </script>
</body>
</html>
