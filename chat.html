<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101713">
  <title>FreeForm In-Game Chat</title>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --green: #39d278;
      --green-dark: #168746;
      --panel: rgba(16, 23, 19, .97);
      --line: rgba(255,255,255,.13);
      --text: #f2f7f3;
      --muted: #a6b2a9;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .chat-shell {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }

    .chat-header {
      min-height: 43px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 11px;
      border-bottom: 1px solid var(--line);
    }

    .chat-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .chat-title i { color: var(--green); }

    .chat-status {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 10px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #e6b84f;
    }

    .status-dot.online { background: var(--green); }
    .status-dot.error { background: #ff7066; }

    .messages {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 9px;
      overflow-y: auto;
      padding: 10px;
      scrollbar-color: #44574a transparent;
      scrollbar-width: thin;
    }

    .empty {
      margin: auto;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .empty i {
      display: block;
      margin-bottom: 8px;
      color: #748279;
      font-size: 22px;
    }

    .message {
      max-width: 95%;
      align-self: flex-start;
    }

    .message.own { align-self: flex-end; }

    .message-meta {
      display: flex;
      gap: 6px;
      margin: 0 4px 4px;
      color: var(--muted);
      font-size: 10px;
    }

    .message.own .message-meta { justify-content: flex-end; }

    .message-name {
      color: #c8f2d6;
      font-weight: 700;
    }

    .message-text {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px 10px 10px 3px;
      background: #18221c;
      color: var(--text);
      font-size: 12px;
      line-height: 1.4;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message.own .message-text {
      border-color: rgba(57,210,120,.25);
      border-radius: 10px 10px 3px 10px;
      background: rgba(27,155,82,.25);
    }

    .chat-error {
      min-height: 16px;
      padding: 0 10px 4px;
      color: #ffaaa2;
      font-size: 10px;
    }

    .chat-form {
      display: flex;
      align-items: end;
      gap: 7px;
      padding: 9px;
      border-top: 1px solid var(--line);
    }

    .chat-input {
      width: 100%;
      min-height: 36px;
      max-height: 88px;
      resize: none;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      background: rgba(0,0,0,.2);
      color: var(--text);
      font: inherit;
      font-size: 12px;
      line-height: 1.4;
    }

    .chat-input::placeholder { color: #87948b; }
    .chat-input:focus { border-color: rgba(57,210,120,.65); }

    .send-button {
      width: 37px;
      height: 36px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: #102016;
      cursor: pointer;
    }

    .send-button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    @media (max-width: 520px) {
      .chat-header { min-height: 38px; }
      .messages { padding: 8px; }
      .chat-form { padding: 7px; }
    }
  </style>
</head>
<body>
  <section class="chat-shell" aria-label="In-game chat">
    <header class="chat-header">
      <div class="chat-title">
        <i class="fa-solid fa-comments" aria-hidden="true"></i>
        <span>Game chat</span>
      </div>
  <div class="chat-status" aria-live="polite">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Connecting…</span>
  </div>
</header>

<div class="messages" id="messages" role="log" aria-live="polite">
  <div class="empty" id="emptyState">
    <i class="fa-regular fa-message" aria-hidden="true"></i>
    Join the room and send the first message.
  </div>
</div>

<div class="chat-error" id="chatError" aria-live="polite"></div>

<form class="chat-form" id="chatForm">
  <textarea
    class="chat-input"
    id="chatInput"
    maxlength="180"
    rows="1"
    placeholder="Type a message..."
    aria-label="Type a chat message"></textarea>

  <button class="send-button" id="sendButton" type="submit" aria-label="Send message">
    <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
  </button>
</form>

  </section>
  <script src="assets/freeform.js"></script>
  <script type="module">
    import { initializeApp, getApp, getApps } from
      'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged } from
      'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import {
      getDatabase,
      ref,
      push,
      set,
      query,
      orderByChild,
      limitToLast,
      onChildAdded,
      serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    /*
      Paste the same Firebase WEB APP config used by your project here.
      Do not paste a service-account key or admin private key.
    */
    const firebaseConfig = {
      apiKey: 'PASTE_YOUR_FIREBASE_WEB_API_KEY',
      authDomain: 'freeform-4f8df.firebaseapp.com',
      databaseURL: 'https://freeform-4f8df-default-rtdb.firebaseio.com',
      projectId: 'freeform-4f8df',
      storageBucket: 'freeform-4f8df.firebasestorage.app',
      messagingSenderId: 'PASTE_YOUR_MESSAGING_SENDER_ID',
      appId: 'PASTE_YOUR_FIREBASE_APP_ID'
    };

    const params = new URLSearchParams(location.search);
    const room = (params.get('game') || 'game')
      .replace(/[^a-zA-Z0-9_-]/g, '')
      .slice(0, 40);

    const messagesElement = document.getElementById('messages');
    const form = document.getElementById('chatForm');
    const input = document.getElementById('chatInput');
    const sendButton = document.getElementById('sendButton');
    const errorElement = document.getElementById('chatError');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');

    const clientId = crypto.randomUUID
      ? crypto.randomUUID()
      : String(Date.now()) + Math.random().toString(36).slice(2);

    let auth;
    let database;
    let currentUser = null;
    let currentUsername = 'Guest';
    let stopListening = null;
    const seenMessageIds = new Set();

    function setStatus(text, state = '') {
      statusText.textContent = text;
      statusDot.className = 'status-dot' + (state ? ' ' + state : '');
    }

    function showError(text) {
      errorElement.textContent = text || '';
    }

    function getUsernameFromProfile(profile) {
      if (typeof profile === 'string') return profile;
      if (profile && typeof profile.username === 'string') return profile.username;
      if (profile && typeof profile.displayName === 'string') return profile.displayName;
      return currentUser?.displayName || 'Player';
    }

    async function resolveUsername(user) {
      try {
        const nameKey = 'freeformUsername';
        const stored = localStorage.getItem(nameKey);
        if (stored && stored.trim()) return stored.trim().slice(0, 20);
      } catch {}

      return (user.displayName || 'Player').slice(0, 20);
    }

    function addMessage(id, data) {
      if (!data || typeof data.text !== 'string' || seenMessageIds.has(id)) return;

      seenMessageIds.add(id);
      document.getElementById('emptyState')?.remove();

      const own = data.uid === currentUser?.uid;
      const article = document.createElement('article');
      article.className = 'message' + (own ? ' own' : '');

      const meta = document.createElement('div');
      meta.className = 'message-meta';

      const name = document.createElement('span');
      name.className = 'message-name';
      name.textContent = data.username || 'Player';

      const time = document.createElement('time');
      const timestamp = typeof data.createdAt === 'number' ? data.createdAt : Date.now();
      const date = new Date(timestamp);
      time.dateTime = date.toISOString();
      time.textContent = date.toLocaleTimeString([], {
        hour: 'numeric',
        minute: '2-digit'
      });

      const messageText = document.createElement('div');
      messageText.className = 'message-text';
      messageText.textContent = data.text.slice(0, 180);

      meta.append(name, time);
      article.append(meta, messageText);
      messagesElement.appendChild(article);
      messagesElement.scrollTop = messagesElement.scrollHeight;

      // Tell the game page to display the message over that sender's character.
      window.parent.postMessage({
        type: 'freeform-chat-message',
        messageId: id,
        uid: data.uid,
        name: data.username || 'Player',
        text: data.text.slice(0, 180)
      }, location.origin);
    }

    async function startRoomListener() {
      if (!currentUser || !database) return;

      if (typeof stopListening === 'function') {
        stopListening();
        stopListening = null;
      }

      const roomQuery = query(
        ref(database, 'gameChats/' + room),
        orderByChild('createdAt'),
        limitToLast(60)
      );

      stopListening = onChildAdded(roomQuery, snapshot => {
        addMessage(snapshot.key, snapshot.val());
      });

      setStatus('Connected', 'online');
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();

      const text = input.value.trim().slice(0, 180);
      if (!text) return;

      if (!currentUser || !database) {
        showError('Sign in to Firebase to send messages to other players.');
        return;
      }

      sendButton.disabled = true;
      showError('');

      try {
        const messageRef = push(ref(database, 'gameChats/' + room));

        await set(messageRef, {
          uid: currentUser.uid,
          username: currentUsername,
          text,
          createdAt: Date.now(),
          serverTimestamp: serverTimestamp(),
          clientId
        });

        input.value = '';
        input.style.height = '36px';
        input.focus();
      } catch (error) {
        console.error('Chat send failed:', error);
        showError('Message could not be sent. Check your Firebase rules and sign-in.');
      } finally {
        sendButton.disabled = false;
      }
    });

    input.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    input.addEventListener('input', () => {
      input.style.height = '36px';
      input.style.height = Math.min(input.scrollHeight, 88) + 'px';
    });

    async function initializeChat() {
      try {
        if (
          !firebaseConfig.apiKey ||
          firebaseConfig.apiKey.startsWith('PASTE_') ||
          !firebaseConfig.appId ||
          firebaseConfig.appId.startsWith('PASTE_')
        ) {
          setStatus('Firebase config needed', 'error');
          showError('Add your Firebase web app config in chat.html before using shared chat.');
          sendButton.disabled = true;
          return;
        }

        const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
        auth = getAuth(app);
        database = getDatabase(app);

        onAuthStateChanged(auth, async user => {
          currentUser = user;

          if (!user) {
            currentUsername = 'Guest';
            setStatus('Sign in required', 'error');
            showError('Sign in to FreeForm to read and send shared chat messages.');
            sendButton.disabled = true;

            if (typeof stopListening === 'function') {
              stopListening();
              stopListening = null;
            }
            return;
          }

          currentUsername = await resolveUsername(user);
          showError('');
          sendButton.disabled = false;
          await startRoomListener();
        });
      } catch (error) {
        console.error('Firebase chat initialization failed:', error);
        setStatus('Connection error', 'error');
        showError('Could not connect to Firebase. Check the web config and database URL.');
        sendButton.disabled = true;
      }
    }

    window.addEventListener('beforeunload', () => {
      if (typeof stopListening === 'function') stopListening();
    });

    initializeChat();
  </script>
</body>
</html>
