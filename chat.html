<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101713">
  <title>FreeForm In-Game Chat</title>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --chat-bg: rgba(16, 23, 19, .96);
      --chat-panel: #18221c;
      --chat-border: rgba(255,255,255,.12);
      --chat-text: #f2f7f3;
      --chat-muted: #a6b2a9;
      --chat-green: #39d278;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: var(--chat-text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .chat-widget {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--chat-border);
      border-radius: 12px;
      background: var(--chat-bg);
      box-shadow: 0 10px 35px rgba(0,0,0,.3);
      backdrop-filter: blur(10px);
    }

    .chat-header {
      min-height: 43px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 12px;
      border-bottom: 1px solid var(--chat-border);
      background: rgba(255,255,255,.025);
    }

    .chat-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .chat-heading i { color: var(--chat-green); }

    .chat-state {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--chat-muted);
      font-size: 10px;
    }

    .chat-state-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--chat-green);
    }

    .chat-messages {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 9px;
      overflow-y: auto;
      padding: 11px;
      scrollbar-color: #44574a transparent;
      scrollbar-width: thin;
    }

    .chat-empty {
      margin: auto;
      color: var(--chat-muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .chat-empty i {
      display: block;
      margin-bottom: 8px;
      color: #748279;
      font-size: 22px;
    }

    .chat-message {
      max-width: 95%;
      align-self: flex-start;
      animation: message-in .15s ease-out;
    }

    .chat-message.own { align-self: flex-end; }

    .message-meta {
      display: flex;
      gap: 6px;
      margin: 0 4px 4px;
      color: var(--chat-muted);
      font-size: 10px;
    }

    .chat-message.own .message-meta { justify-content: flex-end; }

    .message-name {
      color: #c8f2d6;
      font-weight: 700;
    }

    .message-bubble {
      padding: 8px 10px;
      border: 1px solid var(--chat-border);
      border-radius: 10px 10px 10px 3px;
      background: var(--chat-panel);
      color: var(--chat-text);
      font-size: 12px;
      line-height: 1.4;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .chat-message.own .message-bubble {
      border-color: rgba(57,210,120,.25);
      border-radius: 10px 10px 3px 10px;
      background: rgba(27,155,82,.25);
    }

    .chat-error {
      min-height: 14px;
      padding: 0 10px 6px;
      color: #ffaaa2;
      font-size: 10px;
    }

    .chat-compose {
      display: flex;
      align-items: end;
      gap: 7px;
      padding: 9px;
      border-top: 1px solid var(--chat-border);
    }

    .chat-input {
      width: 100%;
      min-height: 36px;
      max-height: 88px;
      resize: none;
      padding: 9px 10px;
      border: 1px solid var(--chat-border);
      border-radius: 8px;
      outline: none;
      background: rgba(0,0,0,.2);
      color: var(--chat-text);
      font: inherit;
      font-size: 12px;
      line-height: 1.4;
    }

    .chat-input::placeholder { color: #87948b; }
    .chat-input:focus { border-color: rgba(57,210,120,.65); }

    .chat-send {
      width: 37px;
      height: 36px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: var(--chat-green);
      color: #102016;
      cursor: pointer;
    }

    .chat-send:hover { background: #63e596; }

    @keyframes message-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      .chat-header { min-height: 38px; }
      .chat-messages { padding: 8px; }
      .chat-compose { padding: 7px; }
    }
  </style>
</head>
<body>
  <section class="chat-widget" aria-label="In-game chat">
    <header class="chat-header">
      <div class="chat-heading">
        <i class="fa-solid fa-comments" aria-hidden="true"></i>
        <span>Game chat</span>
      </div>
  <div class="chat-state" aria-live="polite">
    <span class="chat-state-dot"></span>
    <span id="chatStateText">Local chat</span>
  </div>
</header>

<div class="chat-messages" id="chatMessages" role="log" aria-live="polite">
  <div class="chat-empty" id="chatEmpty">
    <i class="fa-regular fa-message" aria-hidden="true"></i>
    Messages you send will appear here.
  </div>
</div>

<div class="chat-error" id="chatError" aria-live="polite"></div>

<form class="chat-compose" id="chatForm">
  <textarea
    class="chat-input"
    id="chatInput"
    maxlength="180"
    rows="1"
    placeholder="Type a message..."
    aria-label="Type a chat message"></textarea>

  <button class="chat-send" type="submit" aria-label="Send message">
    <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
  </button>
</form>

  </section>
  <script src="assets/freeform.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const game = (params.get('game') || 'game')
        .replace(/[^a-z0-9_-]/gi, '')
        .slice(0, 40);

      const playerName = window.FreeForm?.getSession?.() || 'Guest';
      const clientId = window.crypto?.randomUUID
        ? window.crypto.randomUUID()
        : String(Date.now()) + Math.random().toString(36).slice(2);

      const storageKey = 'freeformChat:' + game;
      const maxStoredMessages = 60;

      const chatMessages = document.getElementById('chatMessages');
      const chatForm = document.getElementById('chatForm');
      const chatInput = document.getElementById('chatInput');
      const chatError = document.getElementById('chatError');

      function renderMessage(message, own) {
        const empty = document.getElementById('chatEmpty');
        if (empty) empty.remove();

        const item = document.createElement('article');
        item.className = 'chat-message' + (own ? ' own' : '');

        const meta = document.createElement('div');
        meta.className = 'message-meta';

        const name = document.createElement('span');
        name.className = 'message-name';
        name.textContent = message.name || 'Guest';

        const time = document.createElement('time');
        const date = new Date(message.time || Date.now());
        time.dateTime = date.toISOString();
        time.textContent = date.toLocaleTimeString([], {
          hour: 'numeric',
          minute: '2-digit'
        });

        meta.append(name, time);

        const text = document.createElement('div');
        text.className = 'message-bubble';
        text.textContent = message.text;

        item.append(meta, text);
        chatMessages.appendChild(item);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function readStoredMessages() {
        try {
          const messages = JSON.parse(localStorage.getItem(storageKey) || '[]');
          return Array.isArray(messages) ? messages : [];
        } catch {
          return [];
        }
      }

      function sendMessage(text) {
        const message = {
          name: playerName,
          text: text.slice(0, 180),
          time: Date.now(),
          clientId
        };

        const messages = readStoredMessages();
        messages.push(message);

        try {
          localStorage.setItem(
            storageKey,
            JSON.stringify(messages.slice(-maxStoredMessages))
          );
        } catch (error) {
          console.warn('Chat message could not be saved locally.', error);
        }

        renderMessage(message, true);

        /*
          Tell the parent game page to show the character speech bubble.
          The game page must listen for this exact message type.
        */
        window.parent.postMessage({
          type: 'freeform-chat-message',
          name: playerName,
          text: message.text
        }, window.location.origin);
      }

      readStoredMessages()
        .slice(-maxStoredMessages)
        .forEach(message => renderMessage(message, message.clientId === clientId));

      chatForm.addEventListener('submit', event => {
        event.preventDefault();

        const text = chatInput.value.trim();
        if (!text) return;

        chatError.textContent = '';

        try {
          sendMessage(text);
          chatInput.value = '';
          chatInput.style.height = '36px';
          chatInput.focus();
        } catch (error) {
          console.error('Could not send chat message.', error);
          chatError.textContent = 'Message could not be sent.';
        }
      });

      chatInput.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          chatForm.requestSubmit();
        }
      });

      chatInput.addEventListener('input', () => {
        chatInput.style.height = '36px';
        chatInput.style.height = Math.min(chatInput.scrollHeight, 88) + 'px';
      });

      window.addEventListener('storage', event => {
        if (event.key !== storageKey || !event.newValue) return;

        try {
          const messages = JSON.parse(event.newValue);
          if (!Array.isArray(messages)) return;

          const latest = messages[messages.length - 1];
          if (!latest || latest.clientId === clientId) return;

          renderMessage(latest, false);
        } catch (error) {
          console.warn('Could not read updated chat messages.', error);
        }
      });
    })();
  </script>
</body>
</html>
